name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上的新推送会取消掉还在跑的旧任务，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 代码检查
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 类型检查与构建
        run: npm run build
